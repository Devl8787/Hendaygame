<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Henday Racer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="hud">
      <div id="race-hud" hidden>
        <div id="race-lap"></div>
        <div id="race-time"></div>
        <div id="race-best"></div>
      </div>
      <div id="banner"></div>
      <div id="speed"><span id="speed-value">0</span> km/h</div>
      <div id="top-left">
        <div id="help">W/↑ gas · S/↓ brake/reverse · A/D steer · Space handbrake · R back to road · C camera · Enter restart race</div>
        <div id="track-info"></div>
      </div>
    </div>
    <div id="loading">Loading the Henday…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
